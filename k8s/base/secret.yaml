apiVersion: v1
kind: Secret
metadata:
  name: vllm-secrets
  labels:
    app: vllm-inference
type: Opaque
stringData:
  # Hugging Face token for downloading private/gated models (can be empty for public models)
  hf-token: ""
  # Bearer token required for API clients to send requests to the inference server
  api-key: "sk-kaspersky-de-bearer-token-2026"
