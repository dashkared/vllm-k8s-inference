apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  labels:
    app: vllm-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
    spec:
      # Enforce Rootless security at the Pod level (non-root UID 10001)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      # Bonus 2: Architectural - Dedicated lightweight Rootless initContainer
      # Downloads weights to PVC on cold start; skips on warm restart
      initContainers:
        - name: model-downloader
          image: vllm-model-downloader:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: hf-token
                  optional: true
          volumeMounts:
            - name: model-storage
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"

      # Main inference container running vLLM Engine on CPU
      containers:
        - name: vllm-server
          image: vllm-inference:v1.0.4
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: api-key
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: model-storage
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "7Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 3

      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: vllm-model-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
